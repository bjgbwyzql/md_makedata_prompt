# ============================================================
# 通用 AI 图像标注 - 配置模板（只读参考）
# 实际运行读取的是同目录下的 配置.yaml，请改那个文件。
# ============================================================

接口:
  # 任意 OpenAI 兼容接口，地址写到 /v1 或服务商要求的版本路径为止
  # 火山方舟示例：https://ark.cn-beijing.volces.com/api/plan/v3
  # 阿里云百炼示例：https://xxx/compatible-mode/v1
  地址: "https://ark.cn-beijing.volces.com/api/plan/v3"
  # 在这里填写你的 API Key
  密钥: "在这里填写你的 API Key"
  # 支持图片输入的模型名称
  模型: "doubao-seed-2.1-pro"
  # 单张图片的请求超时时间（秒），思考型模型建议 600 以上
  超时秒: 600
  重试次数: 3
  # 让模型直接输出 JSON；个别接口不支持时会自动关闭并重试
  使用JSON模式: true
  # 思考开关：enabled / disabled；留空则不发送该参数
  思考模式: "enabled"
  # 输出 token 上限 = 思考过程 + 标注 JSON；太小会导致 JSON 被截断
  最大输出Token: 32768

网络:
  # 只有接口必须经过系统代理时才改成 true
  使用系统代理: false
  代理地址: ""
  校验SSL: true

# 当前使用的任务文件；也可以运行时用 --任务 临时覆盖
任务文件: "任务/黑白mask.yaml"

路径:
  # 把待标注图片放进这个文件夹
  输入图片: "输入图片"
  # 去掉 EXIF、缩放后的图片
  清洗后图片: "清洗后图片"
  # 本次运行的所有结果都放在这个目录下
  结果目录: "结果"
  # 下面三项留空时自动使用 结果目录/原始JSON、结果目录/掩码、结果目录/可视化
  原始JSON目录: ""
  掩码目录: ""
  可视化目录: ""

图片处理:
  最长边: 2048
  JPEG质量: 90

批量处理:
  并发数: 1
  跳过已处理: true
  支持的扩展名: [".jpg", ".jpeg", ".png"]

输出:
  保存清洗图: true
  保存原始JSON: true
  保存COCO: true
  COCO文件名: "标注结果.json"
  保存掩码: true
  掩码前景值: 255

可视化:
  启用: true
  最长边: 1600
  线宽: 4
  透明度: 70
  字号: 24
  # 留空自动查找系统中文字体
  字体文件: ""
  总览图:
    启用: true
    列数: 2
    单图最长边: 900
    背景色: [24, 26, 32]
    边距: 24
    标签高度: 48
