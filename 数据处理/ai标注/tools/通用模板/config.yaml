# =====================================================================
# AI 标注模板分发器配置
#
# 作用：把 ai标注/通用模板 完整复制一份，作为某个使用人的独立工作区。
#
# 运行方式（在 PyCharm 里运行 init.py）：
#   python init.py                ← 用下面 name；name 为空时控制台提示输入
#   python init.py --name 张三    ← 命令行临时指定名字
#   或双击 run.bat
#
# 产物结构：
#   ai标注\<name>\标注引擎.py、配置.yaml、任务\...（整套可直接运行）
# =====================================================================

# ★ 使用人名字：决定目标文件夹名。
#   留空则运行 init.py 时在控制台提示输入；也可用 --name 覆盖。
name: "XXX"

# 模板来源目录：相对本文件所在目录，默认 ai标注/通用模板。
# 一般不用改；除非模板被挪了位置。
template_dir: "../../通用模板"

# 目标父目录：相对本文件所在目录，默认 ai标注 目录。
# 复制结果 = <target_parent>/<name>/<dest_subdir>
target_parent: "../.."

# 使用人文件夹里再套一层的目录名。
# 设为 "" 则直接平铺到 <ai标注>/<name>/ 下，点进去就是标注文件。
dest_subdir: ""

# 名字里不允许出现的字符（Windows 文件夹名限制），命中则初始化报错
illegal_name_chars: '<>:"/\\|?*'

# 目标已存在时的行为：
#   abort  = 直接停止，提示改名或手动处理（推荐，防止误覆盖别人成果）
#   backup = 把旧目录改名为 <name>_备份_yymmdd_HHMMSS，再复制新模板
on_conflict: "abort"

# 复制时排除的内容（相对模板根，glob 风格）：
#   旧密钥、旧结果、旧输入图片、缓存都不带走，交付干净模板。
exclude:
  - "**/__pycache__"
  - ".idea"
  - ".idea/**"
  - "配置.yaml"
  - "结果"
  - "结果/**"
  - "清洗后图片"
  - "清洗后图片/**"
  - "输入图片/**"
