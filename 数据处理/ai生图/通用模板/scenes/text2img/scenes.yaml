# =====================================================================
# text2img 场景配置（通用模板）—— 文生图批量造底图
#
# 运行方式（在本目录下）：
#   python run.py list
#   python run.py building_single --count 300
#   python run.py building_roof_pattern --count 50 --batch 1
#
# 本文件改什么：
#   api_key      —— grsai 密钥。留空 "" 则读环境变量 GRSAI_API_KEY 或 .env。
#   base_prompt  —— 场景主体提示词（每张图都带）。
#   variants     —— 变体池：每张图随机挑一条拼进 prompt，保证多样性。
#   negative_prompt —— 负向词。迭代教训请写在注释里。
#   target_size  —— [宽, 高]，下载后中心裁剪+缩放到该尺寸（对齐真实无人机样本）。
#
# 本文件是两层结构：
#   defaults —— 全局默认参数（api_key、输出路径、模型、尺寸、张数、target_size…），
#                所有场景共享；单个场景里同名键可覆盖它。
#   scenes   —— 各场景的提示词与变体池；加新场景就在 scenes: 下复制一段改即可，
#                不用写代码、不用碰 run.py。
# 参数优先级：命令行 --count/--batch/--size > 场景同名键 > defaults。
# =====================================================================

defaults:
  # ★ 用哪个提示词场景：填 scenes 下的键名（building_single / building_roof_pattern）。
  #   写好这行后可直接 `python run.py` 零命令行运行；
  #   命令行传场景名可临时覆盖。
  scene: "building_single"
  # 密钥：推荐留空走环境变量 GRSAI_API_KEY；要写死就填 sk- 开头的串
  api_key: ""
  # 输出根目录：生成的底图和任务状态 json 都落在其下
  # （自动建 <output_root>/images/<场景>_<时间戳>/、tasks/）。
  # 可写相对仓库根的路径（默认 output）或绝对路径如 G:/数据/output
  output_root: "output"
  image_size: "4K"            # 1K / 2K / 4K（平台配额和耗时可接受再上 4K）
  aspect_ratio: "4:3"
  model: "gpt-image-2"        # gpt-image-2 / nano-banana-2 / nano-banana-fast
  target_count: 100           # 每次运行计划生成张数
  batch_size: 5               # 每批提交任务数（长提示词场景建议 1，质量更稳）
  submit_interval: 2
  poll_interval: 3
  poll_max: 300
  request_timeout: 30
  stale_running_seconds: 1800 # 文生图任务慢，残留判定放宽到 30 分钟
  target_size: [4032, 3024]   # 与真实无人机测绘样本一致（4032x3024 RGB PNG）

scenes:

  # ------------------------------------------------------------------
  # 单栋建筑底图（干净屋顶版，作 img2img 的"一期"底图用）
  # ------------------------------------------------------------------
  building_single:
    desc: "单栋建筑正射底图，屋顶干净规整，占画面50%~70%"
    file_prefix: "building"
    base_prompt: |-
      生成一张真实4K级别的无人机正射航拍建筑影像，严格垂直向下俯视，无地平线、无天空、无广角畸变，效果类似清晰的无人机测绘正射照片。画面只有1栋主体建筑，主体建筑占画面面积的50%至70%，可有1栋极小附属建筑，但不能出现密集楼群、城市天际线或大量无关建筑。每张图片的建筑功能、层数、外墙材料、颜色、平面形状和周边环境必须依据具体场景随机变化，不同图片不能总是同一种浅色校园办公楼。建筑屋顶必须规整、干净、完整：90%以上为连续平整的防水屋面，屋顶边缘有清晰整齐的女儿墙；最多只允许一处小型集中设备区，设备数量不超过4个，不出现长距离外露管线、密集设备、杂物或杂乱结构。建筑轮廓、屋顶边缘、窗格、道路标线、停车位、树冠纹理和阴影必须锐利清晰，材质真实，色彩自然克制。建筑周围只保留少量合理环境，例如道路、人行道、少量停车位、零散车辆、铺装广场或绿化树木。
    negative_prompt: |-
      多栋密集楼群，城市全景，建筑太小，主体建筑占画面太少，画面内容过多，模糊，低清晰度，低分辨率，噪点，过度压缩，重复纹理，重复窗户，屋顶杂乱，屋顶堆满设备，密集空调外机，复杂外露管线，长距离管道，密集太阳能板，水箱群，屋顶施工材料，屋顶杂物，屋顶破损，屋顶积水，脚手架，吊车，施工工地，倾斜视角，地平线，天空，云层，明显透视，广角畸变，卡通，插画，油画，3D渲染，游戏地图，科幻建筑，未来城市，欧式城堡，寺庙，圆顶建筑，尖顶红瓦屋顶，悬空建筑，错误比例，错误阴影，文字，logo，水印，比例尺，地图标注
    variants:
      - "一栋6层现代校园教学楼，浅米色石材立面、深灰蓝色玻璃窗、规则竖向格栅，平屋顶有两处设备机房和少量管线，周围为校园道路与树木"
      - "一栋5层现代园区办公楼，暖灰色外墙、玻璃幕墙和白色屋顶女儿墙，屋顶有空调外机、通风设备与少量太阳能板，周边为铺装广场和少量停车位"
      - "一栋7层社区服务中心或医院门诊楼，浅灰石材和玻璃幕墙外立面，矩形平屋顶，屋顶设备分布整齐，周边有道路、停车位和绿化带"
      - "一栋6层大学实验楼，浅灰色外墙、深色窗带、局部金属格栅，L形平屋顶，屋顶有设备机房、管线和楼梯间，周边为树木和人行道"
      - "一栋5层现代公寓或宿舍楼，米白色外墙、深灰玻璃窗、规整长方体体量，平屋顶有女儿墙和少量设备，周边为内部道路、停车位和绿化"
      - "一栋4层城市公共文化中心，浅米色石材立面、大面积玻璃入口区域、平屋顶设备层，建筑周围为简洁灰色广场和少量景观树"
      - "一栋8层研发办公楼，暖灰色竖向格栅与蓝灰色玻璃窗，屋顶有多个规整设备区和太阳能板，建筑主体清晰、周围环境简洁"
      - "一栋5层学校行政办公楼，浅色石材、玻璃窗、规则窗格，平屋顶配有白色女儿墙、设备机房和金属管线，周边仅有一条道路和少量绿化"

  # ------------------------------------------------------------------
  # 屋顶第五立面板（07 版演进结果：设备/管道/采光顶构图）
  # 迭代教训：模型爱画大圆圈和无人机巢，必须写进负向词；
  #          粗管道要反复强调"粗、清晰、有连接关系"，否则画成细线。
  # ------------------------------------------------------------------
  building_roof_pattern:
    desc: "2~3栋园区建筑，屋顶第五立面带光伏/采光带/粗管道（batch 建议 1）"
    file_prefix: "roofpattern"
    batch_size: 1
    base_prompt: |-
      生成一张高真实感4K无人机正射航拍影像。相机严格垂直俯视、无明显倾斜透视，采用低空近距离无人机拍摄。画面主体为2至3栋现代高品质园区建筑，建筑群占画面约80%至90%，建筑边缘、屋顶结构和屋顶设备清晰可辨；周边仅保留少量道路、规则铺装、庭院、停车区域和绿化。

      建筑类型和造型必须具有多样性。每张图随机采用一种不同的现代建筑风格，可以是现代科研园区、公共服务中心、文化建筑、企业总部、医疗科研中心、高品质校园或新区办公建筑。建筑平面可随机采用L形、U形、H形、回字形、折线形、错位组合、大小体块拼接或中央庭院布局，避免每次生成相同的长方形红砖建筑。

      建筑立面从以下组合中随机选择一种：
      1. 红棕色砖墙、浅灰石材与蓝灰玻璃幕墙；
      2. 米白色石材、深灰金属板与大面积蓝灰玻璃；
      3. 暖灰色混凝土、木色金属格栅与深色玻璃；
      4. 白色金属板、银灰色铝板与局部深蓝玻璃；
      5. 深灰石材、铜棕色金属板与浅灰玻璃；
      6. 浅米色石材、红褐色装饰构架与玻璃连廊。

      屋顶必须具有真实、现代且富有设计感的第五立面。不同建筑之间采用不同的屋顶布局，不要重复统一图案。屋顶可随机使用浅灰色、暖灰色、深灰色或银灰色防水屋面，并从以下设计中选择2至4种组合：

      1. 错位矩形设备区：使用深灰色矩形设备基础，将空调、风机和管道集中布置；
      2. 长条形玻璃采光带：蓝灰色玻璃配深色金属框架，可采用直线形、L形或十字形；
      3. 大型矩形或多边形玻璃采光顶，框架分格清晰；
      4. 2至3排深蓝灰色光伏板，可采用平行、错列或L形排列；
      5. 局部深灰色金属格栅设备平台或百叶围合机械区；
      6. 局部浅绿色屋顶花园、规则种植池或小型屋顶庭院，但面积适中；
      7. 不同高度的屋顶退台、连廊顶棚、悬挑雨棚或阶梯式屋面；
      8. 少量浅灰、深灰或砖红色矩形色块，通过设备基础、检修通道和铺装形成有节奏的屋面构图；
      9. 一处规整的矩形通风机房、楼梯间或电梯机房；
      10. 局部折线形检修通道、金属步道或规则设备维护区域。

      每张图都必须出现清晰可见的粗管道。每栋主要建筑屋顶至少设置一组粗管道，每组包含1至3条管道。管道必须尺寸较大、粗细统一、轮廓清楚，视觉宽度约0.6至1.2米，可以是银灰色金属圆形管道或浅灰色矩形通风风管。

      粗管道采用短距离直线、平行双管、L形、U形、Z形或直角转弯布局，通过清晰的弯头连接空调机组、风机或通风机房。管道不能无目的地横穿整个屋顶，必须具有合理工程连接关系。管道表面具有金属质感，边缘带有深灰色描边或接缝，支架、弯头、连接口和短阴影清晰可见。管道与浅色屋面形成明显对比，不能过细、不能模糊、不能与屋面融为一体。

      每栋建筑随机设置2至4类屋顶设施，屋顶设施总覆盖面积控制在15%至25%，保留大面积干净屋面。设施可以包括：

      1. 4台空调外机按照2×2或1×4整齐排列，放置于深灰色矩形基础上；
      2. 一处深灰色矩形通风机房，四周设置清晰百叶格栅；
      3. 1至3台大型屋顶风机、离心风机或排风机，底座和扇叶外壳清晰；
      4. 每栋主要建筑必有一组粗而清晰的金属管道或矩形通风风管；
      5. 2至3排深蓝灰色光伏板，排列方式规整但不过度密集；
      6. 一处大型蓝灰色玻璃采光顶或长条采光带；
      7. 少量通风帽、排烟口、检修口或水箱，按组排列；
      8. 少量金属检修步道和设备维护平台。

      所有设施必须采用轮廓明确的工程几何形状，与屋面形成明显色差。设备基础、百叶、边框、管道弯头、接缝、支架以及短而清楚的自然阴影必须可辨。屋顶设备分区合理、疏密有序，不能随机散落，不能铺满屋顶。

      屋顶设计应体现真实建筑功能与设计感，通过采光顶、设备区、光伏板、粗管道、机房、退台、检修通道和局部屋顶绿化形成不同组合。禁止所有建筑重复同一种屋顶图案，不要生成规则圆圈，不要把屋顶设计成简单重复符号。

      图像整体要求：4K超清正射影像，屋顶纹理清晰，管道轮廓锐利，设备边缘明确，建筑结构完整，曝光均衡，色彩真实，阴影方向统一。保持真实无人机航拍摄影质感，不要出现人物、文字、标识和水印。
    negative_prompt: |-
      大尺寸圆形图案，红色圆圈，深红色圆圈，重复圆圈，圆形屋顶装饰，密集圆形，圆形停机坪，巨大圆形构筑物，屋顶符号，屋顶文字，艺术化图案，彩色花纹，小点阵花纹，网格花纹，复杂装饰。

      无人机机巢，无人机机舱，无人机停放舱，无人机平台，无人机，直升机，停机坪，H字标志。

      每次相同的建筑，全部红砖建筑，单一长方形建筑，重复楼体，建筑造型单调，建筑风格完全一致，建筑排列机械重复，巨大厂房，简易仓库，农村自建房，破旧建筑，施工工地。

      没有管道，管道过细，细线状管道，管道不清晰，管道轮廓模糊，管道与屋面融为一体，半透明管道，断裂管道，扭曲管道，蛇形管道，交叉缠绕管道，大量杂乱管线，管道铺满屋顶，管道横穿整个屋顶，无目的管道，悬空管道，管道穿过光伏板，管道穿过采光顶。

      设备铺满屋顶，密集小型空调外机，设备随机散落，设备朝向不一致，设备相互重叠，光伏板过多，设备数量过多，设备比例夸张，设备轮廓模糊，细小看不清的屋顶构件，设备与屋面颜色融在一起，半透明设备，无边界设备，无阴影设备，低对比度屋顶设备，重复复制设备，屋顶垃圾，锈蚀设备，屋顶脏乱。

      远距离高空拍摄，建筑在画面中太小，大面积空地，大面积树林，非垂直俯视，明显倾斜透视，广角畸变，鱼眼畸变，低清晰度，模糊，像素化，噪点，过度锐化，过度曝光，强烈黑色阴影，卡通风格，插画风格，游戏画面，明显3D渲染感，人物，车辆特写，文字，标识，水印。
    variants:
      - "生成两栋现代科研办公建筑，采用L形与错位矩形组合，通过玻璃连廊连接。立面采用米白色石材、深灰金属板和蓝灰玻璃。主楼屋顶设置L形玻璃采光带、两排光伏板和一组2×2空调外机；副楼设置矩形通风机房和两台大型风机。两栋楼屋顶都必须出现粗而清晰的银灰色通风管道，采用L形或U形连接，弯头、支架和阴影清晰。不要圆形屋顶图案。"
      - "生成三栋高品质新区公共服务建筑，采用U形围合与高低错落布局，形成中央庭院。立面使用红棕色砖墙、浅灰石材和蓝灰玻璃。不同屋顶分别采用长条采光顶、深灰百叶设备区、错列光伏板和局部屋顶绿化。每栋主要建筑均有1至2组粗管道，采用平行双管、直角转弯或短Z形布局，与风机和空调机组合理连接。屋顶构图丰富但保持干净。"
      - "生成两栋现代企业总部建筑，采用H形与折线形建筑平面。立面使用白色金属板、银灰色铝板和深蓝灰色玻璃。屋顶采用深浅灰色矩形分区、十字形玻璃采光带、设备维护平台和整齐光伏板。每栋建筑必须设置明显的粗矩形通风风管，管道宽大、边缘锐利，通过直线和直角弯头连接通风机房。不要出现任何圆圈或无人机设施。"
      - "生成两至三栋现代医疗科研建筑，采用回字形、L形和小型附属楼组合，中央形成绿化庭院。立面使用暖灰色混凝土、木色金属格栅和浅蓝灰色玻璃。屋顶设置多边形采光顶、浅绿色屋顶花园、空调机组和大型排风机。所有主要屋顶必须出现粗银灰色圆形管道，采用短U形或平行排列，管道接头、固定支架和投影清楚，屋顶设备总量适中。"
      - "生成三栋具有设计感的现代文化与教育建筑，建筑体块采用不对称错位布局，局部设置玻璃连廊、退台和悬挑雨棚。立面使用深灰石材、铜棕色金属板和蓝灰玻璃。屋顶分别设置折线形检修步道、大型矩形采光顶、光伏板和百叶机械区。每栋建筑设置一组粗而清晰的金属风管，风管使用L形、Z形或直角折线连接设备，不能细小或杂乱。"
      - "生成两栋高品质现代校园建筑，一栋为U形教学楼，一栋为紧凑型科研楼，中间由长条玻璃连廊连接。立面采用浅米色石材、局部红褐色构架和蓝灰色玻璃。屋顶使用阶梯式退台、长条玻璃采光带、规整空调设备区和少量光伏板。两栋建筑屋顶均设置粗大的浅灰色矩形通风管道，采用短距离平行布局并连接风机房，轮廓、弯头、支架和阴影必须清楚。"
