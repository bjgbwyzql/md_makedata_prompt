# =====================================================================
# img2img 场景配置（通用模板）—— 图生图造双时相变化对
#
# 运行方式（在本目录下）：
#   python run.py list                        # 列出所有场景
#   python run.py roof_violation --source D:/data/一期图 --count 99
#   python run.py garbage_roadside --source D:/data/房区图
#
# 本文件改什么：
#   api_key      —— grsai 密钥。留空 "" 则读环境变量 GRSAI_API_KEY 或 .env。
#                   ⚠ 写在明文 yaml 里注意别提交进 git（可 .gitignore 掉本文件
#                   另存 scenes.local.yaml，或干脆只用环境变量）。
#   prompt / negative_prompt —— 每个场景的变化描述与负向词，直接改文字即可。
#   source_dir / target_count / batch_size / image_size / model —— 可放
#                   defaults 全局，也可在单个场景里覆盖；命令行参数优先级最高。
#
# 本文件是两层结构：
#   defaults —— 全局默认参数（api_key、输入输出路径、模型、尺寸、批大小…），
#                所有场景共享；单个场景里同名键可覆盖它。
#   scenes   —— 各场景的提示词与专属参数；加新场景就在 scenes: 下复制一段，
#                改场景名 + desc + prompt 即可，不用写代码、不用碰 run.py。
# 参数优先级：命令行 --source/--count/--batch/--size > 场景同名键 > defaults。
# =====================================================================

defaults:
  # ★ 用哪个提示词场景：填 scenes 下的键名（如 roof_violation / roof_complete）。
  #   写好这行后可直接 `python run.py` 零命令行运行；
  #   命令行传场景名（python run.py roof_complete）可临时覆盖。
  scene: "roof_violation"
  # 密钥：推荐留空走环境变量 GRSAI_API_KEY；要写死就填 sk- 开头的串
  api_key: ""
  # 一期底图目录（输入路径）：写死后 run.py 就不用带 --source 了；
  # 也可在单个场景里写 source_dir 覆盖；命令行 --source 优先级最高。
  # ⚠ 路径一律用正斜杠 / （如 G:/国创岚天/正射/xxx），不要用反斜杠 \，
  #   YAML 双引号里 \U \x 等会被当转义符报错。
  source_dir: ""
  # 输出根目录：生成的 after/before 图和任务状态 json 都落在其下
  # （自动建 <output_root>/images/<场景>_<时间戳>/、before/、tasks/）。
  # 可写相对仓库根的路径（默认 output）或绝对路径如 G:/数据/output
  output_root: "output"
  image_size: "4K"          # 1K / 2K / 4K
  model: "gpt-image-2"      # gpt-image-2 / nano-banana-2 / nano-banana-fast
  batch_size: 5             # 每批提交任务数，<=0 先全提交再统一轮询
  target_count: -1          # 生成对数；-1=每张底图各生成1次；底图不足会重复抽取补足
  submit_interval: 2        # 两次提交间隔秒（接口限速严就调大）
  poll_interval: 3          # 轮询间隔秒
  poll_max: 300             # 每轮最长等待秒，超时任务标 failed 防卡死
  stale_running_seconds: 300  # 历史 running 超过该时长视为手动停止残留
  request_timeout: 30
  shuffle: true             # 随机打乱底图顺序
  copy_before: true         # 成功后复制原图为 before（配成双时相对，别关）
  align_to_source: true     # after 图缩放回原图尺寸保证配准（别关）

scenes:

  # ------------------------------------------------------------------
  # 屋顶违规变化对（旗舰场景，原 ag_stable.py 二期垃圾+随机违规）
  # ------------------------------------------------------------------
  roof_violation:
    desc: "一期屋顶巡查图 → 二期：1处必选建筑垃圾堆 + 随机2~3种其他违规"
    prompt: |-
      基于输入的一期无人机屋顶巡查影像，生成同一地点对应的二期影像。

      每张图必须生成以下内容：

      第一，固定生成1处明显但规模适中的屋顶建筑垃圾堆。

      第二，再从其他违规类型中随机选择2至3种不同类型进行生成。

      因此，每张图片总共必须包含3至4种屋顶变化。垃圾堆是必选项，另外2至3种变化随机选择。不得只生成垃圾，也不得生成清单中的全部违规。

      一、固定生成的建筑垃圾堆

      随机选择一栋具有平屋顶的建筑，在设备围挡内部、设备机房旁、女儿墙内侧或屋顶角落生成1处建筑垃圾和施工残料堆。

      垃圾堆面积约3至8平方米，高度约0.3至0.8米，整体为低矮、不规则、相互堆叠的一小堆。

      垃圾堆主要包含：

      1. 2至4个绿色或深绿色旧编织袋、蛇皮袋或建筑垃圾袋；
      2. 一小块揉皱的绿色防水布或绿色塑料布；
      3. 少量灰白色防水材料、保温材料、包装膜或旧篷布；
      4. 少量灰色水泥块、破碎板材、石膏板或轻质建筑碎料；
      5. 极少量短金属条、短管材、纸板或木板碎片。

      垃圾堆颜色以绿色、灰白色、浅灰色和少量深灰色为主。绿色编织袋或防水布必须清楚可见，但不能覆盖整个垃圾堆。垃圾应呈自然杂乱、边缘不规则、相互遮挡的集中堆放状态。

      垃圾底部必须真实接触屋面，具有短而自然的接触阴影。允许在垃圾堆周围0.5至1米范围内散落少量细小碎屑，但不得大面积扩散。

      二、随机增加2至3种其他违规

      从以下类型中随机抽取2至3种不同类型，只生成抽中的类型：

      1. 小型彩钢临时房：面积约10至20平方米，采用浅灰色、灰蓝色或暗灰色彩钢板，具有小门和单坡金属屋顶，只生成一间。
      2. 简易违规雨棚：使用灰色细钢柱和浅灰色金属顶板，面积约8至15平方米，设置在机房或屋顶出入口旁。
      3. 临边空调设备外露：在距离女儿墙1至2米的位置新增2至4台银灰色VRV外机或大型空调外机，没有百叶遮挡，设备底座和顶部风扇清楚。
      4. 屋顶风机外露：新增1至2台银灰色离心风机、排风机或冷却设备，位置靠近屋顶边缘，具有真实底座和连接结构。
      5. 粗大管道外露：新增一组银灰色圆形管道或矩形通风风管，宽度或管径约0.5至1米，采用短距离直线、L形或U形连接，弯头、法兰和支架清晰。
      6. 设备百叶围挡破损：将原有设备围挡中的2至4片百叶处理为弯折、缺失或脱落状态，使内部设备局部暴露，但保留围挡主体。
      7. 设备锈蚀与渗漏：随机选择一台原有空调机组、风机或金属设备，增加局部暗红褐色锈迹、灰黑色油污或少量冷凝水痕迹。
      8. 屋面防水破损：生成一处面积约6至15平方米的防水层开裂、翘边、起皮或局部剥落，边缘自然不规则。
      9. 屋面污染：在排风设备、排水口或机房附近生成一处不规则灰褐色污渍、油污或细长流痕，面积约8至18平方米。
      10. 局部积水：在屋顶低洼位置生成1处暗灰蓝色浅层积水，面积约5至12平方米，边缘自然，具有轻微反光和潮湿痕迹。
      11. 材料堆放：新增少量防水卷材、木质托盘、灰色板材或短金属型材，集中堆放在6至10平方米范围内，与绿色垃圾堆保持明显距离。
      12. 通信天线或卫星天线：新增1至2根小型白色通信天线，或者1个直径约1至2米的浅灰色卫星接收天线，具有真实支架，不得形成大型通信塔。
      13. 水箱与水泵外露：新增一个中型银灰色圆柱水箱或矩形组合水箱，旁边配有小型水泵箱和两条短连接管。
      14. 检修口敞开：新增或修改一处矩形检修口，使深灰色金属盖板保持翻开状态，内部只有自然暗部，不得形成巨大黑洞。
      15. 检修通道堵塞：在屋顶检修通道局部堆放少量工具箱、材料袋、托盘或短管材，使通道部分受阻，但仍能辨认通道边界。
      16. 防护栏杆破损：将设备平台上的一小段金属栏杆处理为弯曲、横杆缺失或连接松脱状态，破损长度约2至4米。

      三、数量与分布要求

      每张图片必须包含：1处绿色建筑垃圾堆；加上2至3种其他不同违规；总计3至4种变化。

      随机选择1至3栋建筑进行修改，不要修改所有建筑。不同违规应分散到不同屋顶区域，不能全部围绕垃圾堆生成。

      每栋屋顶最多生成2种变化。如果图中只有一栋主要建筑，则将不同变化放在相距较远的屋顶区域，保持空间分离。

      每种随机违规原则上只出现1处。垃圾堆只生成1处，不得重复生成多个相同垃圾堆。

      所有新增目标的总面积不得超过可见屋顶面积的15%。每栋屋顶至少保留75%以上完全不变的原始屋面，禁止设备、临建、垃圾和管道铺满屋顶。

      所有目标必须准确落在屋面上，具有真实工程比例、清晰轮廓、合理底座、支架、接触关系和短而自然的阴影。新增内容的曝光、清晰度、噪点、色温和材质必须与原始无人机影像一致。

      允许随机采用一种非常轻微的成像差异：保持原光照不变、薄云柔光、轻度阴天、色温轻微偏暖或偏冷。整体亮度、色温和对比度变化不超过原图的10%，所有违规目标仍必须清楚可辨。

      除指定的3至4种变化外，严格保持原图中的建筑数量、楼体位置、建筑高度、屋顶外轮廓、女儿墙、未被选中的设备、管道、光伏板、采光顶、道路、车辆、树木、绿化和铺装完全不变。

      保持输入图片的相机高度、无人机俯拍角度、镜头焦距、透视关系、画面构图、图像尺寸和所有物体空间坐标不变。不得裁剪、缩放、旋转、平移或整体重绘，确保一期与二期影像准确配准。
    negative_prompt: |-
      只生成垃圾，没有生成另外两至三种违规，只生成一种变化，只生成两种变化，生成超过四种变化，生成清单中的全部违规。

      多个垃圾堆，所有屋顶都有垃圾，相同垃圾堆重复复制，大型垃圾场，垃圾铺满屋顶，大面积垃圾山，生活垃圾，厨余垃圾，垃圾填埋场。

      所有违规都集中在垃圾堆旁边，屋顶局部过度拥挤，所有建筑都发生变化，所有屋顶都出现违规，目标铺满屋顶。

      大量彩钢房，大型仓库，大型厂房，大量空调外机，大量管道，管线密集缠绕，大型通信塔，巨大水箱，大面积积水，大面积屋顶坍塌。

      鲜绿色垃圾袋，五颜六色垃圾，整齐摆放的新建材，垃圾呈完美矩形，垃圾变成绿色污渍，垃圾变成草丛，垃圾目标太小看不清。

      设备悬空，设备穿过屋面，管道扭曲，管道穿过设备，目标相互融合，目标比例错误，错误底座，错误支架，错误接触关系，错误阴影。

      改变未被选中的原有设备，删除原有设备，删除原有管道，删除光伏板，修改采光顶，改变建筑数量，改变楼体位置，改变建筑高度，改变屋顶外轮廓，改变女儿墙。

      改变道路，改变车辆，改变树木，改变绿化，改变铺装，改变周围环境，移动画面，旋转画面，裁剪画面，缩放画面，改变相机角度，改变焦距，改变图像尺寸，配准错位，整体重绘。

      剧烈天气变化，暴雨，积雪，厚重大雾，夜景，日落，强烈逆光，阴影方向相反，严重过曝，严重欠曝。

      红色检测框，红色标注框，箭头，圆圈，文字，数字，商标，标识，水印，人物，施工人员。

      卡通风格，插画风格，游戏画面，明显3D渲染感，低分辨率，模糊，涂抹痕迹，复制粘贴纹理。

  # ------------------------------------------------------------------
  # 农村自建房时相链：放线 → 地基 → 封顶
  # ------------------------------------------------------------------
  outline_marking:
    desc: "农田/裸地新增一处拟建房屋白灰放线轮廓（违建最早期信号）"
    prompt: |-
      仅在图中的农田或裸土地面上新增一处明显的拟建房屋轮廓，像农村自建房施工前用白灰、水泥粉或浅色砂浆标出的房屋占地边界。每幅图只生成一处。轮廓应比普通石灰线更清楚，呈浅灰白色或米白色，线条宽度适中，形成一个清晰可见的矩形房屋外框，内部可有少量房间分隔线或地基分隔线。轮廓必须贴合地面，不能变成墙体或屋顶。可以让轮廓周围的地表略微被压平、变浅或有少量施工痕迹，使变化更明显。保持农田纹理、道路、树木、已有建筑、相机视角和整体场景结构不变。
    negative_prompt: |-
      生成多个轮廓，完整房屋，屋顶，高墙，实体墙体，楼房，混凝土高地基，大量建材堆放，大型施工现场，覆盖大片农田，改变整片农田纹理，改变道路，改变树木，改变相机视角，线条过细看不见，线条过粗像道路，颜色纯白发光，像贴纸，像3D渲染，新增文字，新增水印。

  roof_complete:
    desc: "未完工地基/基础梁网格 → 已封顶的低矮平屋顶"
    prompt: |-
      将图中的未完工房屋地基或基础梁网格区域，转换为已经封顶的低矮平屋顶建筑效果。原本可见的基础梁网格、内部砖块、纸箱和杂物应被一整块浅灰白色或米白色平整屋面覆盖，屋面边缘与原地基外轮廓基本一致，不改变建筑占地范围和相机视角。屋面可以有轻微水泥纹理、污渍、阴影和不均匀色差，不能是纯白色贴片。保持周边道路、树木、空地、已有建筑和整体场景结构不变，生成效果应符合无人机高空影像的光照、分辨率和压缩噪声。
    negative_prompt: |-
      改变占地轮廓，扩大建筑范围，生成高楼，生成多层建筑，生成坡屋顶，生成彩色屋顶，保留明显地基网格，保留大量内部杂物，屋面纯白无纹理，像贴纸，像3D渲染，边缘过于锐利，悬浮屋顶，改变相机视角，改变道路树木周边建筑，大面积重绘，新增文字，新增水印。

  # ------------------------------------------------------------------
  # 屋顶加装光伏
  # ------------------------------------------------------------------
  rooftop_solar:
    desc: "屋顶新增分布式光伏板阵列（旧板质感，贴合透视）"
    prompt: |-
      请基于输入的无人机正射航拍图进行真实遥感风格的局部编辑，在图中选择少量适合安装光伏的屋顶，自然生成真实屋顶分布式太阳能光伏板阵列。请优先选择面积较大、无遮挡、结构清晰的平屋顶、厂房屋顶、彩钢瓦屋顶或农村房屋屋顶；不适合安装的位置保持原样，不要强行生成。

      光伏板不能是一整块单调黑色平面，必须呈现真实组件阵列结构：由多块独立矩形太阳能板拼接组成，有清晰但不过锐利的行列分块、细密电池片网格、浅灰或银灰色金属边框、面板之间的窄缝、阵列边缘框架和局部支架阴影。每块组件应有轻微亮暗差异、蓝黑色或深灰蓝色玻璃质感、细微反光、压缩噪声和航拍模糊，整体看起来像真实航拍照片中的光伏组件，而不是贴上去的黑色矩形。

      光伏阵列应有足够的细节和厚度感：面板边缘可以有轻微投影，阵列下方可有很浅的阴影或支架暗线，部分区域可受到树影、屋顶女儿墙、烟囱、天窗、屋脊或屋面结构影响，形成自然遮挡和亮度变化。面板表面可以出现轻微灰尘、局部反光不均、色块差异和组件拼接痕迹，但不要过脏、不要破损夸张。

      光伏板必须贴合屋顶方向和建筑透视关系，沿屋顶长边、屋檐、屋脊或厂房边界整齐排列。阵列大小要符合屋顶尺度，可以覆盖屋顶一部分或大部分，但必须保留合理屋檐边距、检修通道、屋顶边缘和障碍物避让空间。不要越出屋顶边界，不要跨到道路、树冠、水体、车辆、院墙或相邻建筑上。

      不同屋顶上的光伏阵列可以有自然差异：有的为大面积整齐矩形阵列，有的为几排较小组件，有的只覆盖屋顶一侧；颜色可以是深蓝、蓝黑、黑灰或深灰蓝，反光强弱、组件数量、排列方向和新旧程度可以不同。不要每个屋顶都安装，也不要所有光伏板完全一样。

      只允许修改光伏板所在屋顶或硬质平面的小范围区域及其紧邻纹理。不要改变房屋轮廓、屋顶整体形状、道路走向、树木形状、水体、车辆、院墙、农田和整体空间布局。不要重绘整张图，不要生成大型地面光伏电站。

      保持无人机正射俯视角度、原始分辨率、真实遥感影像质感和建筑空间关系。最终效果应像真实航拍图中自然安装在屋顶上的完整分布式太阳能光伏板阵列。
    negative_prompt: |-
      一整块黑色矩形，纯黑色方块，没有组件分块，没有电池片网格，没有边框，没有缝隙，平面贴纸感，空洞单薄，悬浮太阳能板，太阳能板没有厚度，太阳能板越出屋顶边界，太阳能板跨到道路上，太阳能板跨到树冠上，太阳能板跨到车辆上，太阳能板跨到水体上，随机乱放，方向与屋顶不一致，透视关系错误，比例过大，比例过小，边缘过锐，反光过强，镜面反射，发光板，玻璃幕墙，普通窗户被误生成太阳能板，每个屋顶都安装，覆盖整张图，大型地面光伏电站，改变房屋轮廓，改变屋顶形状，改变道路走向，改变树木形状，改变车辆位置，改变整张图光照，改变季节，整图重绘，卡通，插画，3D渲染，游戏地图，模型感，透视视角，斜拍视角，低空近景，生成天空，地平线，文字，水印，logo，地图标注，红色标注框，箭头，重复纹理，阴影方向混乱，阴影过黑

  # ------------------------------------------------------------------
  # 森林 → 荒地（配合 text2img 造的森林底图）
  # ------------------------------------------------------------------
  forest_to_bare:
    desc: "森林/树冠密集区 → 荒地、采伐迹地、裸土"
    prompt: |-
      请基于输入的无人机正射航拍图进行真实遥感风格图像编辑，将图中森林、林地、树冠密集区域自然转化为荒地、裸地或采伐后空地。

      荒地变化可以是局部区域，也可以是大面积区域，比例随机但要自然合理。被改变的森林区域应去除树冠覆盖，呈现黄褐色、灰褐色或浅土黄色裸露地表，可包含干燥泥土、砂石、碎石、稀疏枯草、低矮灌木残留、树桩、枯枝、车辙、土路痕迹、局部湿润暗色土斑、采伐后不规则空地等细节。

      允许荒地区域周边背景随之发生合理变化，例如林缘变稀疏、裸土与草地过渡、地表颜色和纹理发生变化、阴影减少或改变、局部出现不规则空隙和自然斑块，使画面看起来像真实航拍中的森林退化、采伐、干旱或土地裸露结果。

      必须保持无人机高空正射俯视视角，保持原图的地形走向、道路、水体、田块边界、建筑轮廓、河沟、山体坡向和整体空间布局基本不变。不要改变相机角度，不要裁剪图片，不要旋转图片，不要改变原始分辨率比例。生成结果应与原图的光照方向、阴影强度、清晰度、压缩噪声、航拍质感和遥感影像风格一致。

      荒地区域边界要自然、不规则、有过渡，不要像规则矩形或人工涂抹。整体画面必须真实、自然、可信，像同一地点经过森林减少或地表裸露后的真实无人机正射影像。
    negative_prompt: |-
      卡通，插画，油画，3D渲染，游戏地图，卫星地图标注，文字，水印，logo，边框，比例尺，图例，网格线，地图标注，明显人工涂抹，规则矩形荒地，重复纹理，复制粘贴感，过度锐化，过度模糊，低清晰度，颜色过饱和，荧光色，不真实的沙漠化效果。

      不要改变正射俯视视角，不要生成天空、地平线、侧视角、倾斜透视。不要新增大型建筑，不要删除原有道路，不要改变道路走向，不要改变河流和水体形状，不要改变建筑轮廓，不要生成车辆、人物、动物、机械设备。不要把整张图变成城市、农田、沙漠或纯色地面。不要产生明显断裂边缘、错误阴影、不合理比例、漂浮物体、伪影、畸变。

  # ------------------------------------------------------------------
  # 垃圾系列（共同铁律：最小改动——只加垃圾，禁止新建地面/平台）
  # ------------------------------------------------------------------
  garbage_open:
    desc: "空地袋装生活垃圾小堆（垃圾系列·变体1）"
    prompt: |-
      对原图进行最小范围的局部物体添加：只在原图已经存在的一小块真实地面上添加一处普通日常生活垃圾堆，绝对不要生成、补建或改造任何环境结构。直接使用原图现有地表作为垃圾承载面，不得为了放置垃圾而新建或扩大房屋、楼群、屋顶、空地、平台、水泥地、道路、院落、围墙、棚子、垃圾站或其他设施，也不得改变原有地面的形状、范围、材质和颜色。垃圾集中为一个低矮紧凑的小堆，以单层摆放为主，少量两层自然重叠，高度不超过0.7米。若画面存在船只，整堆最长边不超过最小可见船只长度的三分之一，且必须明显小于船只；若没有船只，整堆不超过半个小汽车停车位并明显小于附近汽车。垃圾由八到十八个扎口且有装填感的日常垃圾袋组成，以乳白色、浅灰色和半透明塑料袋为主，搭配少量低饱和浅蓝色、浅绿色袋子，黑色和深灰色垃圾袋只占少数；另有两到四只浅棕色压扁旧纸箱，以及极少量透明塑料瓶、白色餐盒和低饱和彩色包装。所有物品彼此靠近并集中在同一处，外围只允许一两件小物。垃圾必须直接贴合原有地面，只有紧贴垃圾底部的自然接触阴影，透视、尺寸、清晰度、颜色、光照、颗粒感和压缩噪声与原图一致。若画面有水域，垃圾只能放在原图已经存在的干燥岸边地面上，不能修改水面、岸线或生成新平台。除垃圾及其微弱接触阴影覆盖的局部区域外，原图所有建筑、空地、平台、道路、水面、船只、岸线、树木、车辆和背景必须保持原样，不添加方框、线条或图形标记。
    negative_prompt: |-
      新增房屋，新增居民楼，新增建筑群，新增楼顶，新增屋顶，新增空地，新增平台，空地平台，水泥平台，高台，地基，台阶，码头平台，扩大地面，填平水面，开辟空地，新建道路，新建院落，新建围墙，新建棚子，新建垃圾站，新建垃圾房，新建垃圾收集亭，新增垃圾桶设施，改变地表材质，重绘大片地面，改变建筑结构，改变空地范围，改变平台轮廓，改变水面，改变岸线，改变船只，改变道路树木车辆，背景重建，大面积重绘，垃圾在屋顶，垃圾在平台顶部，垃圾在水面，垃圾漂浮，垃圾在船上，垃圾悬空，垃圾没有接地阴影，垃圾比船大，垃圾袋与汽车一样大，高耸垃圾山，多层高堆，多个垃圾堆，满地零散垃圾，全部黑色垃圾袋，大面积纯黑垃圾，建筑垃圾，砖块，水泥块，钢筋，碎石，木板，红框，矩形框，检测框，标注线，箭头，圆圈，文字，水印，贴纸效果，3D渲染，边缘过度锐利。

  garbage_roadside:
    desc: "房区道路旁垃圾堆（垃圾系列·变体2）"
    prompt: |-
      对原始无人机高空俯拍的房区影像进行严格的加法式局部编辑：必须在原图已有马路或巷道的道路旁边添加一处清楚可见的中等规模生活垃圾堆，不能返回没有变化或垃圾难以发现的图片，但只能叠加垃圾，绝不能删除、替换或移动原图中的任何物体。垃圾堆至少一侧必须直接紧贴原图清晰可见的道路外缘、路缘或路肩，中间不能隔着围墙、建筑、树冠、空地或其他物体；垃圾必须与道路上的汽车、摩托车或行人处于同一个地面高度和平面。只能放在道路外侧不影响车辆通行的现有地面，不能放在机动车道中央、道路交叉口、建筑入口、院落内部、停车通道或道路以外的封闭区域。选择能够完整容纳垃圾、视线无遮挡、不在深色阴影中且不靠近画面边缘的一段道路边缘；如果某处空间不足，应沿现有道路改选另一处，不能缩小到看不见，也不能移除树木、清除植被、改造屋顶或生成新地面。垃圾不得与任何树冠、屋顶、女儿墙、露台、雨棚或建筑平台重叠。垃圾堆约3到4米长、1.5到2.5米宽，占地大致相当于一辆小汽车或一个停车位，但不得超过一辆半汽车的占地；整体高度约0.4到0.8米，低矮平缓，以单层摆放为主，少量两层自然重叠。垃圾由十八到三十个扎口且有装填感的日常垃圾袋、三到五只压扁旧纸箱，以及少量塑料瓶、餐盒和食品包装组成；以乳白色、浅灰色、半透明和浅棕色为主，加入少量低饱和蓝色、绿色、红色包装，黑色垃圾袋只占少数。所有垃圾彼此接触并集中成一个轮廓完整、略不规则的混合色垃圾堆，与道路旁地面形成清楚但自然的颜色和纹理差异，外围最多只有两三件紧贴主堆的小物。垃圾必须直接贴合原有道路旁地面，只有紧贴底部的自然接触阴影，尺寸、透视、清晰度、光照、颗粒感和压缩噪声与原图一致。原图中每一棵树以及所有屋顶、建筑、道路、车辆的数量、位置、轮廓、纹理、颜色和阴影必须完全保留。除垃圾及其底部接触阴影覆盖的少量路边地面像素外，原图其余区域保持不变，不添加任何方框、文字或标记。
    negative_prompt: |-
      垃圾远离道路，垃圾与道路之间隔着建筑，垃圾与道路之间隔着围墙，垃圾与道路之间隔着树木，垃圾在院落内部，垃圾在封闭空地，垃圾在道路中央，垃圾阻断车道，垃圾在道路交叉口，垃圾遮挡建筑入口，垃圾占用停车通道，没有生成垃圾，原图完全没有变化，垃圾难以发现，垃圾过小不可见，垃圾藏在阴影中，垃圾被树木遮挡，垃圾位于画面边缘，删除树木，少了一棵树，树木消失，缩小树冠，改变树冠形状，垃圾覆盖树冠，清除植被，生成裸地，扩大裸地，垃圾在屋顶，垃圾在房顶，垃圾在楼顶平台，垃圾在露台，垃圾在雨棚，垃圾在建筑平台，把屋顶识别为地面，改变屋顶轮廓，改变建筑结构，新增平台，新增空地，新增道路，新增房屋，新增围墙，背景重建，大面积重绘，垃圾堆超过一辆半汽车占地，超大型垃圾堆，高耸垃圾山，多层高堆，多个垃圾堆，满地零散垃圾，垃圾悬空，垃圾没有接地阴影，透视错误，全部黑色垃圾袋，大面积纯黑垃圾，建筑垃圾，砖块，水泥块，钢筋，碎石，木板，红框，矩形框，检测框，箭头，圆圈，文字，水印，贴纸效果，3D渲染，边缘过度锐利。

  garbage_field:
    desc: "田边混合垃圾倾倒点（垃圾系列·变体3）"
    prompt: |-
      对原始无人机高空俯拍影像进行局部编辑，必须在画面中实际新增一处清楚可见、真实自然的混合生活垃圾倾倒点，不能返回没有变化的原图。先识别原图已经存在的乡村道路边缘、房屋或厂区外围、田边、林地边缘、沟渠旁干燥地面以及裸土与杂草交界处，从中选择一处可由现有道路到达、没有树冠完全遮挡的合理位置。只能使用原图已有地面承载垃圾，不得新建空地、平台、道路、建筑、围墙或垃圾站。垃圾应为人为多次倾倒后形成的低矮、不规则混合垃圾堆，不是整齐排列的袋装垃圾。垃圾堆中心较密集，许多物品互相接触和遮挡，边缘有少量碎片紧贴裸土和杂草自然扩散，但不能散布到整幅画面。垃圾堆最宽处约为附近乡村道路宽度的0.6到1.5倍，整体高度低于0.8米，不堆成山，面积随原图地面空间自然调整，并明显小于附近建筑占地。垃圾以灰白色、浅灰色、半透明和浅棕色为主，包括白色或半透明塑料袋、编织袋、压扁纸箱、泡沫餐盒、塑料瓶、食品包装袋、废纸和少量旧布料，加入少量低饱和蓝色、绿色、红色包装形成自然色差；黑色垃圾只占少数，不能形成整块黑斑。垃圾必须直接贴合原有地面，部分被杂草轻微遮挡，具有真实接触阴影、脏污和不均匀纹理。垃圾的尺寸、透视、清晰度、光照、颗粒感和压缩噪声必须与原航拍影像一致。除垃圾及其紧邻区域外，保持原有房屋、厂房、农田、道路、沟渠、水面、岸线、植被、车辆和相机视角不变，不添加任何标注图形。
    negative_prompt: |-
      没有生成垃圾，原图完全没有变化，垃圾过小不可见，只生成一两个垃圾袋，整齐排列的垃圾袋，全部黑色垃圾袋，大面积纯黑垃圾，垃圾堆成高山，超大型垃圾场，垃圾均匀铺满画面，垃圾出现在农田中央，垃圾出现在道路中央，垃圾在屋顶，垃圾在水面，垃圾漂浮，垃圾悬空，垃圾被树冠完全遮挡，新增房屋，新增厂房，新增空地，新增水泥平台，新增道路，新增围墙，新增垃圾站，改变地表形状，大面积重绘，建筑垃圾，成堆砖块，水泥块，钢筋，巨大石块，红框，矩形框，检测框，箭头，圆圈，文字，水印，贴纸效果，3D渲染，边缘过度锐利。

  construction_debris:
    desc: "建筑拆除废料倾倒点（垃圾系列·变体4）"
    prompt: |-
      对原始无人机高空俯拍影像进行严格的加法式局部编辑，必须在画面中实际新增一处或两处清楚可见、真实自然的建筑拆除废料倾倒点，只添加废料，绝不能删除、替换或移动原图中的任何物体。先识别原图已有的道路外缘、路肩、田地边界、果园或树林边缘、围墙外侧、施工建筑外围和现有裸土地面，从中选择车辆能够到达、没有树冠完全遮挡的合理位置。建筑废料必须直接放在原图已经存在的地面上，优先沿道路、田埂、围墙或场地边界呈低矮不规则分布，不能生成在屋顶、水面、农作物中央、树林内部或机动车道中央。废料倾倒点可以是约4到8米长、2到4米宽的块状小堆，也可以沿田边、道路或围墙形成约8到18米长、1.5到3米宽的狭长废料带；整体高度约0.3到0.8米，以平铺和少量叠压为主，不堆成高山。主体由大量破碎的灰白色混凝土块、水泥砂浆块、石膏板、轻质隔墙板、破损水泥板和不规则建筑板材组成，混入适量红褐色碎砖、瓦片、瓷砖、陶瓷碎片和浅棕色砂浆，少量加入折断木板、细金属杆、短管件和破损塑料薄膜。所有材料必须呈现已经废弃和破碎的状态，大小不一、棱角不规则、表面有灰尘、裂纹和污渍，许多碎块互相接触、覆盖和叠压，不能像整齐堆放的新建材。废料中心较密集，边缘逐渐稀疏，少量小碎片紧贴裸土和杂草自然散落，可被边缘杂草轻微遮挡，但不能均匀铺满整幅画面。整体色彩以灰白、浅灰、土黄和红褐色为主，形成符合真实建筑废料的颗粒与块状纹理。废料必须贴合地面，具有自然接触阴影、遮挡关系和航拍尺度，清晰度、透视、光照、颜色、颗粒感和压缩噪声与原图一致。保持原有道路、农田、树木、植被、围墙、建筑、屋顶、车辆、水面、岸线和相机视角完全不变，不创建新道路、平台、建筑或裸地，不添加任何方框、文字或标记。
    negative_prompt: |-
      没有生成建筑废料，原图完全没有变化，废料过小不可见，袋装生活垃圾，黑色垃圾袋，食品垃圾，餐盒和饮料瓶占主体，彩色生活垃圾场，完整整齐的新砖，整齐码放的建材，未破损的新水泥板，纯白色连续贴片，白色地毯，新增水泥道路，新增混凝土平台，新增建筑，新增围墙，新增裸地，改变地表形状，废料在屋顶，废料在水面，废料在农作物中央，废料在树林内部，废料在机动车道中央，废料阻断道路，废料悬空，废料没有接地阴影，删除树木，少了一棵树，改变树冠，清除植被，改变农田，改变道路，改变建筑屋顶，背景重建，大面积重绘，超大型建筑垃圾山，高耸锥形废料堆，多层高堆，废料覆盖大片画面，均匀撒满小白点，透视错误，边缘过度锐利，红框，矩形框，检测框，箭头，圆圈，文字，水印，贴纸效果，3D渲染。

  # ------------------------------------------------------------------
  # 光照/阴影族：负样本——只有光照差异、没有真实地物变化
  # （通用负面词放在 defaults 不行，这里每个场景自带；重点是"只改阴影不改地物"）
  # ------------------------------------------------------------------
  shadow_building:
    desc: "负样本·建筑长阴影（只加阴影不改地物）"
    prompt: |-
      仅在图中多栋建筑同一侧生成明显的自然建筑阴影，模拟白天太阳角度较低时的后时相无人机影像。阴影从房屋、围墙、屋顶边缘自然投射到地面、道路、院落或空地上，长度比原图更长，颜色更深，为低饱和灰黑色，边缘柔和但清晰可见。所有建筑阴影方向必须一致，符合统一太阳光照。不要改变建筑本身、屋顶颜色、道路、树木、农田和其他真实地物，只改变阴影。
    negative_prompt: |-
      新增建筑，删除建筑，改变屋顶颜色，改变建筑轮廓，改变道路，改变树木形状，改变农田纹理，新增车辆，新增堆料，新增地基，实体黑色物体，黑色贴纸，纯黑色块，阴影边缘过硬，阴影方向混乱，多个太阳方向，夜晚，傍晚过暗，整图过暗，强烈滤镜，过曝，过暗，大面积重绘，改变相机视角，改变透视，新增文字，新增水印。

  shadow_tree:
    desc: "负样本·树影增强"
    prompt: |-
      仅明显增强图中树木和植被投射到地面、道路、院落或屋顶上的阴影。树影应比原图更深、更长，并向同一方向偏移，呈自然树冠投影形状，边缘柔和且不规则。部分树影可以覆盖道路、院落边缘或屋顶局部，但树木本身、建筑、道路、农田和地块边界必须完全不变。
    negative_prompt: |-
      新增建筑，删除建筑，改变屋顶颜色，改变建筑轮廓，改变道路，改变树木形状，改变农田纹理，新增车辆，新增堆料，实体黑色物体，阴影边缘过硬，阴影方向混乱，多个太阳方向，夜晚，整图过暗，强烈滤镜，大面积重绘，改变相机视角，新增文字，新增水印。

  shadow_cloud:
    desc: "负样本·云影局部变暗"
    prompt: |-
      在图中生成一到两片明显但自然的云影区域，模拟白天无人机航拍中云层遮挡太阳造成的局部变暗。云影应覆盖画面局部建筑、道路、树木或农田，形成大范围柔和灰暗区域，亮度明显低于周围区域，但边界非常柔和、过渡自然。云影只影响亮度和色调，不改变任何建筑、道路、树木、农田或物体形状，整体仍为白天清晰影像。
    negative_prompt: |-
      新增建筑，删除建筑，改变地物形状，实体黑色物体，阴影边缘过硬，阴影方向混乱，夜晚，暴雨，积雪，厚重大雾，整图过暗，强烈滤镜，大面积重绘，改变相机视角，新增文字，新增水印。

  lighting_timeshift:
    desc: "负样本·上午下午时移（亮度色温阴影整体差异）"
    prompt: |-
      模拟同一区域不同白天时段的无人机后时相影像。整张图允许出现明显但自然的亮度、色温和阴影差异，像上午和下午拍摄时间不同造成的效果。建筑和树木阴影整体变得更长、更深，并向统一方向偏移；部分道路、院落和屋顶边缘被阴影覆盖。所有真实地物保持不变，不新增建筑、堆料、车辆或地基，只生成由光照和阴影变化造成的后时相差异。
    negative_prompt: |-
      新增建筑，删除建筑，改变屋顶颜色，改变建筑轮廓，改变道路，改变树木形状，改变农田纹理，新增车辆，新增堆料，新增地基，阴影方向混乱，多个太阳方向，夜晚，傍晚过暗，整图过暗，强烈滤镜，过曝，大面积重绘，改变相机视角，改变透视，新增文字，新增水印。

  shadow_hard_negative:
    desc: "负样本·强阴影干扰（易误检区域，专门压误报）"
    prompt: |-
      生成一张阴影干扰明显的白天后时相无人机图像。建筑、树木和围墙投影比原图明显更深、更长，多个阴影覆盖道路、院落、屋顶边缘和空地局部，形成容易被误检为变化的灰黑色投影区域。所有阴影必须方向一致，边缘自然柔和，不能是纯黑色块。不要改变任何建筑、道路、树木、农田、车辆和地物结构。阴影强度应达到肉眼明显可见，覆盖画面约10%到25%的局部区域，但不能遮挡到无法识别地物。
    negative_prompt: |-
      新增建筑，删除建筑，改变屋顶颜色，改变建筑轮廓，改变道路，改变树木形状，改变农田纹理，新增车辆，新增堆料，新增地基，实体黑色物体，黑色贴纸，纯黑色块，阴影边缘过硬，阴影方向混乱，多个太阳方向，夜晚，整图过暗，强烈滤镜，大面积重绘，改变相机视角，新增文字，新增水印。
