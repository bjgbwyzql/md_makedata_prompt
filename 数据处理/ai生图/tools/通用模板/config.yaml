# =====================================================================
# 新人工作区初始化配置（通用模板）
#
# 作用：把仓库根的 通用模板/ 完整复制一份，作为新人的独立工作区。
#
# 运行方式（在本目录下）：
#   python init.py                ← 用下面 name 配置的新人名字
#   python init.py --name 张三    ← 命令行临时指定名字
#   或直接双击 run.bat
#
# 产物结构：
#   G:\国创岚天\正射\ortho-data-gen\<name>\通用模板\...（整套可用代码+配置）
# =====================================================================

# ★ 新人名字：决定目标文件夹名，如 "张三" / "li_wei"。
#   也可运行时用 --name 覆盖。
name: "张鑫"

# 模板来源目录：相对本文件所在目录，默认上一级再进 通用模板。
# 一般不用改；除非模板被挪了位置。
template_dir: "../../通用模板"

# 目标父目录：相对本文件所在目录，默认 ortho-data-gen 仓库根。
# 复制结果 = <target_parent>/<name>/<dest_subdir>
target_parent: "../.."

# 新人文件夹里再套一层的目录名（保持和源模板同名，方便对照）。
# 设为 "" 则直接平铺到 <name>/ 下。
dest_subdir: ""

# 名字里不允许出现的字符（Windows 文件夹名限制），命中则初始化报错
illegal_name_chars: '<>:"/\\|?*'

# 目标已存在时的行为：
#   abort  = 直接停止，提示改名或手动处理（推荐，防止误覆盖别人成果）
#   backup = 把旧目录改名为 <name>_备份_yymmdd_HHMMSS，再复制新模板
on_conflict: "abort"

# 复制时排除的内容（相对模板根，glob 风格）：
#   缓存不带走；output 只建空目录不带旧产物；.env 密钥每人自己配。
exclude:
  - "**/__pycache__"
  - "output/images/**"
  - "output/before/**"
  - "output/tasks/**"
  - ".env"
