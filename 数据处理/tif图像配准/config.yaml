# ============================================================================
# TIF 卫星影像自动配准配置（以“参考影像”为基准）
#
# 运行方式：
#   - PyCharm：直接运行 tif_register.py（当前解释器缺 GDAL 会自动切换到本机 QGIS Python）
#   - 命令行： "C:\Program Files\QGIS 3.x\apps\Python312\python.exe" tif_register.py -c config.yaml
#   - 临时覆盖路径： tif_register.py -c config.yaml -r 参考.tif -t 待配准.tif -o 结果.tif --epsg 4527
#
# 换机器 / 给别人用：复制 config_模板.yaml 为 config.yaml，只改三个影像路径和 EPSG 即可。
#
# 说明：
#   1. 参考影像 = 基准（配置里的第一张）；待配准影像 = 被校正的第二张。
#   2. 两张图的范围/尺寸/分辨率/坐标系可以不同：脚本会先把第二张重采样到第一张的格网
#      （临时 VRT，运行结束自动删除），再做局部非刚性配准。
#   3. 输出为北向上 GeoTIFF，尺寸、原点、分辨率与参考影像完全一致。
#   4. 待配准原图不会被修改；两图坐标系不同时，请把“坐标系.EPSG代码”设为参考影像的坐标系。
# ============================================================================

# ---------------- 路径规则 ----------------
# 路径支持“绝对路径”和“相对路径”。
# 相对路径的基准由“路径基准”决定：配置文件（默认）/ 脚本目录 / 当前工作目录。
# Windows 路径建议用正斜杠 /，或用单引号包裹，避免 YAML 转义。
# 绝对路径示例：D:/data/参考.tif  或  \\server\share\参考.tif
# 相对路径示例：../卫星图/雄县卫星图数据/202609/202609.tif
路径基准: "配置文件"

# ---------------- 输入与输出 ----------------
# 注意：Windows 路径不要用双引号（\ 会被 YAML 当转义符，如 \t、\卫）。
# 请用单引号，或把 \ 改成 /。
# 参考影像 = 基准（第一张）：输出的格网、范围、分辨率都以它为准
参考影像: 'D:\tiff数据\卫星图\雄县卫星图数据\202608\202608.tif'
# 待配准影像 = 第二张：会被校正到参考影像的格网
待配准影像: 'D:\tiff数据\卫星图\雄县卫星图数据\202609\202609.tif'
输出影像: 'D:\tiff数据\卫星图\雄县卫星图数据\202609\202609_配准.tif'

# 输出文件已存在时是否允许覆盖（建议保持 false，防止误删）
覆盖已有输出: false

# ---------------- 坐标系 ----------------
坐标系:
  # 输出影像使用的 EPSG 代码。填 4527 可修正“只有 ESRI 名称、没有 EPSG”
  # 导致的 QGIS 无坐标转换警告；留空则沿用参考影像的坐标系。
  # 注意：这里只是把坐标系“标识”写成该 EPSG，不做投影转换，坐标数值必须本身匹配。
  EPSG代码: 4527

  # 是否顺便把参考影像的文件头也改成上面的 EPSG（只改坐标系标识，不动像素和坐标）。
  # 会修改原文件，建议确认后再开启。
  同时修正参考影像: false

# ---------------- 控制点测量 ----------------
测量:
  # 2 = 按半分辨率读取（速度快，推荐）；1 = 全分辨率（更准但慢）
  读取缩放: 1

  # 每个控制点分块覆盖的原始像素大小；影像较小时脚本会自动缩小
  分块像素: 2000

  # 位移搜索范围（原始像素）；两期影像的偏移不应超过这个值
  最大位移像素: 40

  # 分块内有效像元比例低于此值时跳过
  最小有效比例: 0.995

  # 相关系数至少提升多少才认为该控制点有效
  最小NCC提升: 0.03

  # 互相关峰值信噪比阈值（越大越严格）
  最小信噪比: 4.0

  # 与邻域中值比较，剔除明显误匹配的点
  局部剔除半径像素: 2500
  局部剔除阈值像素: 2.5

  # 并行进程数：0 = 自动（建议 4~8；机械硬盘不宜开太多）
  并行进程数: 0

# ---------------- 位移场 ----------------
位移场:
  # 位移场网格间隔（像素）。越小越贴合局部变形，但更容易受噪声影响
  网格步长像素: 1500

  # 每个网格点使用多大范围内的控制点
  插值半径像素: 9000

  # 高斯权重半径（像素）
  权重半径像素: 3000

  # 网格平滑强度（0 = 不平滑）
  高斯平滑: 0.6

  # 留出多少比例的控制点做独立精度验证
  验证比例: 0.2

# ---------------- 重采样 ----------------
重采样:
  # 双线性 / 最近邻 / 三次卷积（影像推荐双线性）
  方法: "双线性"

  # 输出分块大小（像素），内存不足时调小
  分块大小: 2048

  # 输出空值。源影像自带 NoData 时优先使用源影像的值
  空值: 255

  # auto = 优先用 OpenCV（脚本同目录的 pylibs 已附带），没有就用 SciPy
  # opencv = 强制用 OpenCV；scipy = 强制用 SciPy
  # 换电脑或删除 pylibs 后，如需加速可执行：
  #   pip install --target pylibs opencv-python-headless
  加速库: "OpenCV"

  # 压缩：NONE / LZW / DEFLATE / ZSTD（NONE 最快，体积最大）
  压缩: "NONE"

# ---------------- 金字塔 ----------------
金字塔:
  生成: true
  级别: [2, 4, 8, 16, 32, 64, 128, 256, 512]
  # average / nearest / bilinear
  重采样: "average"

# ---------------- 精度检查与对比图 ----------------
精度检查:
  # 生成红绿叠加对比图（红=参考影像，绿=配准结果，重合处偏黄）
  生成对比图: true

  # 检查点数量
  检查点数量: 6

  # 对比图窗口大小（像素）
  对比图尺寸像素: 1200

# 是否输出控制点 CSV 和精度验证 CSV
报告CSV: true
