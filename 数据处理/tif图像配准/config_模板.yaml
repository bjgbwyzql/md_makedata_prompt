# ============================================================================
# TIF 卫星影像自动配准配置 —— 通用模板
#
# 使用方法：
#   1. 把本文件复制/改名为 config.yaml
#   2. 只改下面三个影像路径（参考影像 / 待配准影像 / 输出影像）
#   3. 需要时改“坐标系.EPSG代码”
#   4. 在 PyCharm 里直接运行 tif_register.py，或命令行：
#      "C:\Program Files\QGIS 3.x\apps\Python312\python.exe" tif_register.py -c config.yaml
#
# 说明：
#   - 参考影像（第一张）= 基准；待配准影像（第二张）会被校正到它的格网。
#   - 两张图的范围/尺寸/分辨率/坐标系可以不同，脚本会自动先把第二张重采样到第一张格网
#     （临时 VRT，运行结束自动删除）。
#   - 输出为北向上 GeoTIFF，尺寸、原点、分辨率与参考影像完全一致；原图不会被修改。
#   - 当前 Python 缺 GDAL 时，脚本会自动查找本机 QGIS 并切换；也可用环境变量
#     TIF_REGISTER_PYTHON 指定带 GDAL 的 python.exe。
# ============================================================================

# ---------------- 路径规则 ----------------
# 支持绝对路径和相对路径；相对路径按下面的“路径基准”解析。
# 可选：配置文件（默认）/ 脚本目录 / 当前工作目录
# Windows 路径建议用正斜杠 /，或用单引号包裹，避免 YAML 转义。
# 绝对路径示例：D:/data/参考影像.tif  或  \\server\share\参考影像.tif
路径基准: "配置文件"

# ---------------- 输入与输出 ----------------
# 下面三个都可以用绝对路径；这里用相对路径示例（相对本配置文件所在目录）
# 参考影像 = 基准（第一张）
参考影像: "数据/参考影像.tif"

# 待配准影像 = 第二张（会被校正到参考影像格网）
待配准影像: "数据/待配准影像.tif"

# 输出影像（不要与输入相同；默认不覆盖已有文件）
输出影像: "结果/配准结果.tif"

# 输出文件已存在时是否允许覆盖
覆盖已有输出: false

# ---------------- 坐标系 ----------------
坐标系:
  # 输出影像的 EPSG 代码。
  # 留空(null) = 沿用参考影像的坐标系；参考影像没有 EPSG 标识时建议手动填写。
  # 这里只是把坐标系“标识”写成该 EPSG，不做投影转换，坐标数值必须本身匹配。
  # 例如：CGCS2000 3度带 39 带 = 4527；WGS84 / UTM 50N = 32650。
  EPSG代码: null

  # 是否顺便把参考影像的文件头也改成上面的 EPSG（只改标识，不动像素和坐标）
  同时修正参考影像: false

# ---------------- 控制点测量 ----------------
测量:
  # 2 = 半分辨率读取（快，推荐）；1 = 全分辨率（更准但慢）
  读取缩放: 2

  # 每个控制点分块覆盖的原始像素大小；影像较小时会自动缩小
  分块像素: 2000

  # 位移搜索范围（原始像素）；两期影像的偏移不应超过它
  最大位移像素: 40

  # 分块内有效像元比例低于此值就跳过
  最小有效比例: 0.995

  # 相关系数至少提升多少才接受该点
  最小NCC提升: 0.03

  # 互相关峰值信噪比阈值
  最小信噪比: 4.0

  # 与邻域中值比较，剔除明显误匹配点
  局部剔除半径像素: 2500
  局部剔除阈值像素: 2.5

  # 并行进程数：0 = 自动（建议 4~8；机械硬盘不宜太多）
  并行进程数: 0

# ---------------- 位移场 ----------------
位移场:
  # 位移场网格间隔（像素）
  网格步长像素: 1500

  # 每个网格点使用的控制点范围
  插值半径像素: 9000

  # 高斯权重半径
  权重半径像素: 3000

  # 网格平滑强度（0 = 不平滑）
  高斯平滑: 0.6

  # 留出多少比例的控制点做独立精度验证
  验证比例: 0.2

# ---------------- 重采样 ----------------
重采样:
  # 双线性 / 最近邻 / 三次卷积
  方法: "双线性"

  # 输出分块大小（像素），内存不足时调小
  分块大小: 2048

  # 输出空值；源影像自带 NoData 时优先用源值
  空值: 255

  # auto = 有 OpenCV 就用（脚本目录 pylibs 已附带 Windows 版），没有就用 SciPy
  # opencv = 强制用；scipy = 强制用 SciPy
  # 换电脑/删除 pylibs 后如需加速：
  #   pip install --target pylibs opencv-python-headless
  加速库: "auto"

  # 压缩：NONE / LZW / DEFLATE / ZSTD
  压缩: "NONE"

# ---------------- 金字塔 ----------------
金字塔:
  生成: true
  级别: [2, 4, 8, 16, 32, 64, 128, 256]
  重采样: "average"

# ---------------- 精度检查与对比图 ----------------
精度检查:
  # 生成红绿叠加对比图（红=参考，绿=配准结果，重合处偏黄）；需要 Pillow
  生成对比图: true

  # 检查点数量（0 = 不做精度检查）
  检查点数量: 6

  # 对比图窗口大小（像素）
  对比图尺寸像素: 1200

# 是否输出控制点 CSV 和精度验证 CSV
报告CSV: true
